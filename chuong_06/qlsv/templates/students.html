<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-primary fw-bold">🎓 Danh Sách Sinh Viên</h2>
            
            <table class="table table-hover table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>MSSV</th>
                        <th>Họ và tên</th>
                        <th>GPA</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in students %}
                    <tr>
                        <td>{{ s.id }}</td>
                        <td><strong>{{ s.mssv }}</strong></td>
                        <td>{{ s.name }}</td>
                        <td>
                            <span class="badge {% if s.gpa >= 8 %}bg-success{% else %}bg-secondary{% endif %}">
                                {{ s.gpa }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
