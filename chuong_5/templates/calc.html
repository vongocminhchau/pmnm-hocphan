<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Máy tính cơ bản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { min-height: 100vh; background: radial-gradient(circle at top left, #dbeafe 0, transparent 38%), linear-gradient(135deg, #f8fbff 0%, #eefaf7 100%); }
        .navbar { background: rgba(20, 54, 91, .96); backdrop-filter: blur(10px); }
        .calculator-card { max-width: 760px; border: 0; border-radius: 1.25rem; }
        .calculator-icon { width: 70px; height: 70px; }
        .result-box { border-left: 5px solid #198754; }
        .error { min-height: 20px; font-size: 0.875rem; }
        .form-control, .form-select { border-radius: .7rem; padding: .75rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-calculator-fill me-2"></i>Bài tập Flask</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#exerciseNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="exerciseNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/"><i class="bi bi-calculator me-1"></i>Máy tính</a>
                <a class="nav-link" href="/grades"><i class="bi bi-mortarboard-fill me-1"></i>Tính điểm học phần</a>
                <a class="nav-link" href="/bmi"><i class="bi bi-heart-pulse-fill me-1"></i>Tính BMI</a>
            </div>
        </div>
    </div>
</nav>
<div class="container d-flex align-items-center py-4 py-md-5" style="min-height: calc(100vh - 72px);">
    <div class="card calculator-card mx-auto shadow-lg w-100"><div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="calculator-icon rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center fs-2 mb-3"><i class="bi bi-calculator"></i></div>
            <h1 class="h3 fw-bold mb-1">Máy tính cơ bản</h1>
            <p class="text-secondary mb-0">Nhập hai số và chọn phép tính</p>
        </div>
        <form method="post">
            <div class="row g-3 align-items-start">
                <div class="col-md-4">
                    <label for="a" class="form-label fw-semibold">Số thứ nhất</label>
                    <input class="form-control {% if errors.a %}is-invalid{% endif %}" id="a" name="a" value="{{ values.a }}">
                    <div class="error text-danger mt-1">{% if errors.a %}{{ errors.a }}{% endif %}</div>
                </div>
                <div class="col-md-4">
                    <label for="op" class="form-label fw-semibold">Phép toán</label>
                    <select class="form-select {% if errors.op %}is-invalid{% endif %}" id="op" name="op">
                        <option value="+" {% if values.op == '+' %}selected{% endif %}>+</option>
                        <option value="-" {% if values.op == '-' %}selected{% endif %}>-</option>
                        <option value="*" {% if values.op == '*' %}selected{% endif %}>*</option>
                        <option value="/" {% if values.op == '/' %}selected{% endif %}>/</option>
                        {% if values.op not in ['+', '-', '*', '/'] %}<option value="{{ values.op }}" selected>{{ values.op }}</option>{% endif %}
                    </select>
                    <div class="error text-danger mt-1">{% if errors.op %}{{ errors.op }}{% endif %}</div>
                </div>
                <div class="col-md-4">
                    <label for="b" class="form-label fw-semibold">Số thứ hai</label>
                    <input class="form-control {% if errors.b %}is-invalid{% endif %}" id="b" name="b" value="{{ values.b }}">
                    <div class="error text-danger mt-1">{% if errors.b %}{{ errors.b }}{% endif %}</div>
                </div>
            </div>
            <button class="btn btn-primary btn-lg w-100 mt-2" type="submit"><i class="bi bi-arrow-right-circle me-2"></i>Tính kết quả</button>
        </form>
        {% if result %}
        <div class="alert alert-success result-box d-flex align-items-center mb-0 mt-4" role="alert">
            <i class="bi bi-check-circle-fill fs-4 me-3"></i>
            <div><small class="text-secondary">Kết quả phép tính</small><div class="fs-4 fw-bold">{{ result }}</div></div>
        </div>
        {% endif %}
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
