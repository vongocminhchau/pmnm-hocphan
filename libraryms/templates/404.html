{% extends "base.html" %}

{% block title %}
404 - Không tìm thấy
{% endblock %}

{% block content %}

<div class="error">

    <h1>404</h1>

    <h2>Không tìm thấy trang</h2>

    <p>
        {{ error.description if error.description else "Trang bạn yêu cầu không tồn tại." }}
    </p>

    <br>

    <a href="{{ url_for('index') }}">
        ← Về trang chủ
    </a>

</div>

{% endblock %}
